name: App build
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prettier Check and Format
        run: |
          npm install prettier prettier-plugin-motoko --no-save
          npx -y prettier --plugin prettier-plugin-motoko --write '**/*.{mo,json,md}'

      - name: Commit formatted files
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -u
          git diff-index --quiet HEAD || (git commit -m "chore: format code with prettier" && git pull --rebase origin "$GITHUB_HEAD_REF" && git push origin HEAD:"$GITHUB_HEAD_REF")

      - name: Install mops
        uses: caffeinelabs/setup-mops@v1

      - name: Install toolchain
        run: mops install

      - name: Show moc version
        run: mops toolchain bin moc || mops toolchain use moc latest

      - name: Show mops version
        run: |
          mops --version
          $(mops toolchain bin moc) --version

      - name: Show pocket-ic version
        run: mops toolchain bin pocket-ic

      - name: Run example benchmarks
        run: mops bench
