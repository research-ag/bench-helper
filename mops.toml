[package]
name = "bench-helper"
version = "0.0.3"
description = "Types and helper class to write benchmark files for use with mops bench"
repository = "https://github.com/research-ag/bench-helper"
keywords = [ "mops", "bench" ]
license = "MIT"

[dev-dependencies]
core = "2.6.1"

[optimize]
args = [ "--all-features" ]

[toolchain]
moc = "1.14.1"
pocket-ic = "15.0.0"
wasm-opt = "132"

[requirements]
moc = "1.0.0"
