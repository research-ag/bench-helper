[package]
name = "bench-helper"
version = "0.0.4"
description = "Types and helper class to write benchmark files for use with mops bench"
repository = "https://github.com/research-ag/bench-helper"
keywords = [ "mops", "bench" ]
license = "MIT"

[dev-dependencies]
core = "2.6.2"

[optimize]
args = [ "--all-features" ]

[toolchain]
moc = "2.0.0"
pocket-ic = "16.1.0"
wasm-opt = "133"

[requirements]
moc = "1.0.0"
